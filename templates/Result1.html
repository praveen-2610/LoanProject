<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loan Prediction Result</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #e6e4c9;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }
        .container { margin-top: 150px; }
        h1 { font-size: 40px; font-weight: bold; }
        .btn {
            margin-top: 30px;
            padding: 12px 30px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            background-color: #d3d3d3;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover { background-color: #bcbcbc; }
        .card {
            background: white;
            display: inline-block;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            {% if prediction == "Approved" %}
                <h1 style="color: green;">Approved ✅</h1>
                <p>{{ reason }}</p>

            {% else %}
                <h1 style="color: red;">Rejected ❌</h1>
                <p>{{ reason }}</p>
            {% endif %}

            <form action="/">
                <button type="submit" class="btn">Log out</button>
            </form>
        </div>
    </div>

</body>
</html>
