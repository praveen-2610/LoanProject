<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #fdf6e3;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background-color: #eaffff;
      padding: 40px 30px;
      border-radius: 20px;
      width: 350px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 36px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 18px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      background: white;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #0077cc;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    p {
      text-align: center;
      margin-top: 20px;
      font-size: 16px;
    }

    a {
      color: #0077cc;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Sign In</h1>

    <!-- ✅ IMPORTANT CHANGE -->
    <form action="/login" method="POST">

      <label>Username</label>
      <input type="text" name="username" placeholder="Enter your username" required>

      <label>Password</label>
      <input type="password" name="password" placeholder="Enter your password" required>

      <button type="submit">Sign In</button>

    </form>

    <p>Don't have an account? <a href="/">Create Account</a></p>
  </div>
  {% if message %}
  <script>
    alert("{{ message }}");
  </script>
  {% endif %}
  </script>
</body>
</html>
